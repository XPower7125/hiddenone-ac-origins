<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Days Since The Hidden One Glazed AC Origins</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #eee;
    padding: 20px;
    text-align: center;
  }
  h1 {
    font-size: clamp(1.2rem, 4vw, 2rem);
    margin-bottom: 30px;
    color: #e2c07b;
  }
  .counter {
    font-size: clamp(5rem, 20vw, 10rem);
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 30px rgba(226, 192, 123, 0.5);
    line-height: 1;
  }
  .label {
    font-size: clamp(1rem, 3vw, 1.5rem);
    margin-top: 10px;
    color: #aaa;
  }
  a.yt {
    display: inline-block;
    margin-top: 40px;
    padding: 12px 24px;
    background: #ff0000;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    transition: transform 0.2s, background 0.2s;
  }
  a.yt:hover { background: #cc0000; transform: scale(1.05); }
  #lastGlaze { margin-top: 20px; font-size: 0.9rem; color: #777; }
</style>
</head>
<body>

<h1>Days Since The Hidden One Glazed Assassin's Creed Origins</h1>

<div class="counter" id="days">0</div>
<div class="label">days of peace... so far</div>

<a class="yt" href="https://www.youtube.com/@TheHiddenOne690" target="_blank" rel="noopener">
  ▶ Subscribe to The Hidden One on YouTube
</a>

<a class="yt" href="https://youtu.be/DewVn6tuOmI?si=GxLJxbOPs2foZFgI" target="_blank" rel="noopener" style="background:#282828; margin-left:10px;">
  🎬 Why AC Origins is peak
</a>

<div id="lastGlaze"></div>

<script>
  // Reset: 5:00 PM CET (17:00 UTC+1), October 27, 2026
  const RESET_MS = Date.parse("2026-10-27T17:00:00+01:00");

  function update() {
    const diff = Date.now() - RESET_MS;
    const days = Math.max(0, Math.floor(diff / 86400000));
    document.getElementById("days").textContent = days.toLocaleString();
    const d = new Date(RESET_MS);
    document.getElementById("lastGlaze").textContent =
      "Last glaze: " + d.toLocaleString(undefined, { dateStyle: "long", timeStyle: "short" });
  }

  update();
  setInterval(update, 1000);
</script>

</body>
</html>
